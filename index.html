<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sales Playbook Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a transit-style line per module — stops down a coloured line, branches off each stop, detail panel beside it */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #17212C;
  --muted: #5A6674;
  --rule: #D2D9E1;
  --offer: #B8770C;
  --cold-calling: #0E8676;
  --sales: #2E58CC;
  --on-accent: #FFFFFF;
  --warn-bg: #FFF5E0;
  --warn-rule: #EBCB86;
  --warn-ink: #6B4A00;
  --c: var(--offer);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141A; --surface: #18202A; --ink: #E6EBF1; --muted: #98A4B2; --rule: #2B3644;
    --offer: #E2A33A; --cold-calling: #33B9A6; --sales: #7395F3; --on-accent: #0D1218;
    --warn-bg: #2B2414; --warn-rule: #5E4B22; --warn-ink: #F0D395;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --surface: #18202A; --ink: #E6EBF1; --muted: #98A4B2; --rule: #2B3644;
  --offer: #E2A33A; --cold-calling: #33B9A6; --sales: #7395F3; --on-accent: #0D1218;
  --warn-bg: #2B2414; --warn-rule: #5E4B22; --warn-ink: #F0D395;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px; display: grid; gap: 24px; }

/* Header */
.top { display: grid; gap: 6px; }
.kicker { font: 600 11.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(28px, 4.2vw, 42px)/1.05 var(--font-display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 62ch; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  --tc: var(--offer);
  display: inline-flex; align-items: center; gap: 9px;
  padding: 6px 14px 6px 6px; border: 1px solid var(--rule); border-radius: 999px;
  background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px;
}
.tab .badge {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--tc); color: var(--on-accent); font: 700 12px/1 var(--font-mono);
}
.tab .count { font: 500 12px/1 var(--font-mono); color: var(--muted); }
.tab[aria-selected="true"] { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 13%, var(--surface)); }
.tab[data-mod="cold-calling"] { --tc: var(--cold-calling); }
.tab[data-mod="sales"] { --tc: var(--sales); }
.tab[data-mod="playbook"] { --tc: var(--ink); }
.tab[data-mod="playbook"] .badge { font-size: 14px; }

.search { position: relative; flex: 1 1 260px; max-width: 380px; }
.search input {
  width: 100%; padding: 10px 14px 10px 36px; border: 1px solid var(--rule); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14px;
}
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; stroke: var(--muted); fill: none; }
.results {
  position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
  box-shadow: 0 12px 30px rgba(10, 20, 30, .14); max-height: 380px; overflow: auto; padding: 6px;
}
.result { display: grid; gap: 2px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.result:hover, .result:focus-visible { background: color-mix(in srgb, var(--rc, var(--c)) 11%, var(--surface)); }
.result .r-title { font-weight: 600; font-size: 14px; }
.result .r-meta { font: 500 11.5px/1.3 var(--font-mono); color: var(--muted); }
.result .r-snip { font-size: 13px; color: var(--muted); }
.no-results { padding: 12px; color: var(--muted); font-size: 14px; }

/* Layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 32px; align-items: start; }
.map { display: grid; gap: 20px; min-width: 0; }
.line-head { display: grid; gap: 4px; }
.line-head h2 { font: 800 30px/1.1 var(--font-display); margin: 0; color: var(--ink); }
.line-head h2 .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--c); margin-right: 10px; vertical-align: 3px; }
.line-head p { margin: 0; color: var(--muted); max-width: 60ch; }

/* Side groups (before / after the line) */
.group { border: 1.5px dashed color-mix(in srgb, var(--c) 45%, var(--rule)); border-radius: 14px; padding: 14px 14px 10px; display: grid; gap: 4px; }
.group-label { font: 600 11.5px/1 var(--font-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 2px 10px 6px; }
.gnode { display: grid; gap: 2px; }

/* The line */
.stations { list-style: none; margin: 0; padding: 0; position: relative; display: grid; }
.stations::before {
  content: ""; position: absolute; left: 17px; top: 26px; bottom: 26px; width: 6px;
  border-radius: 3px; background: var(--c);
}
.station { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; padding-block: 8px; align-items: start; }
.dot {
  position: relative; z-index: 1; width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 5px solid var(--c);
  display: grid; place-items: center; font: 600 13px/1 var(--font-mono); color: var(--ink);
  margin-top: 2px; transition: background .15s, color .15s;
}
.station.is-active .dot { background: var(--c); color: var(--on-accent); }
.node-btn {
  display: grid; gap: 1px; width: 100%; text-align: left; border: 1px solid transparent;
  background: none; padding: 7px 12px; border-radius: 10px; cursor: pointer;
}
.node-btn:hover { background: color-mix(in srgb, var(--c) 7%, transparent); }
.node-btn.is-active { background: var(--surface); border-color: color-mix(in srgb, var(--c) 55%, var(--rule)); }
.node-name { font: 700 18px/1.25 var(--font-display); }
.node-short { font-size: 13.5px; color: var(--muted); }
.branches {
  display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px 12px; padding: 4px 0 4px 14px;
  border-left: 2px solid color-mix(in srgb, var(--c) 40%, var(--rule));
}
.chip {
  padding: 4px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface);
  font-size: 13px; font-weight: 500; cursor: pointer; line-height: 1.5;
}
.chip:hover { border-color: color-mix(in srgb, var(--c) 60%, var(--rule)); }
.chip.is-active { background: var(--c); border-color: var(--c); color: var(--on-accent); }
.chip .star-dot { color: var(--c); margin-left: 4px; }
.chip.is-active .star-dot { color: var(--on-accent); }

/* Detail panel */
.panel {
  position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 16px;
  padding: 22px 22px 26px; display: grid; gap: 16px; min-width: 0;
}
.panel-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font: 600 11.5px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.eyebrow::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.close-btn { display: none; border: 1px solid var(--rule); background: var(--bg); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.panel h2 { font: 800 26px/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.summary { margin: 0; font-size: 15.5px; }
.sec { display: grid; gap: 8px; }
.sec h3 { margin: 0; font: 600 11.5px/1 var(--font-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sec ul, .sec ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.sec ol li::marker { font: 600 13px var(--font-mono); color: var(--c); }
.sec ul li::marker { color: var(--c); }

.script {
  border: 1px solid color-mix(in srgb, var(--c) 32%, var(--rule)); border-radius: 12px;
  background: color-mix(in srgb, var(--c) 7%, var(--surface)); padding: 12px 14px 10px; display: grid; gap: 8px;
}
.script q { quotes: "\201C" "\201D"; font-size: 15px; line-height: 1.5; }
.script-actions { display: flex; gap: 6px; justify-content: flex-end; }
.mini {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px;
  padding: 3px 11px; font-size: 12.5px; font-weight: 500; cursor: pointer;
}
.mini[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--on-accent); }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font: 600 11px/1.3 var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--bg); }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; white-space: nowrap; }

.callout { border: 1px solid var(--warn-rule); background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 12px 14px; }
.callout h3 { color: var(--warn-ink); }
.callout ul li::marker { color: var(--warn-ink); }

.branch-list { display: flex; flex-wrap: wrap; gap: 6px; }
.notes textarea {
  width: 100%; min-height: 84px; resize: vertical; padding: 10px 12px; border: 1px solid var(--rule);
  border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px;
}
.hint { font-size: 12px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--rule); padding-top: 14px; }
.pager button { border: 1px solid var(--rule); background: var(--bg); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; text-align: left; max-width: 48%; display: grid; gap: 1px; }
.pager button:last-child { text-align: right; margin-left: auto; }
.pager .p-label { font: 500 11px/1.2 var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pager button[disabled] { visibility: hidden; }

/* Playbook view */
.playbook { display: grid; gap: 18px; max-width: 820px; }
.pb-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.pb-head h2 { font: 800 30px/1.1 var(--font-display); margin: 0; }
.pb-head p { margin: 4px 0 0; color: var(--muted); }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
.pb-mod { --c: var(--offer); display: grid; gap: 10px; }
.pb-mod[data-mod="cold-calling"] { --c: var(--cold-calling); }
.pb-mod[data-mod="sales"] { --c: var(--sales); }
.pb-mod > h3 { margin: 0; font: 700 20px/1.2 var(--font-display); display: flex; align-items: center; gap: 10px; }
.pb-mod > h3::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.pb-item { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.pb-item-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.pb-item-head strong { font: 700 16px/1.3 var(--font-display); }
.pb-note { white-space: pre-wrap; font-size: 14px; border-left: 3px solid var(--c); padding-left: 10px; }
.empty { background: var(--surface); border: 1.5px dashed var(--rule); border-radius: 14px; padding: 24px; color: var(--muted); }
.empty strong { color: var(--ink); }

.scrim { display: none; }

@media (max-width: 899px) {
  .layout { grid-template-columns: 1fr; }
  .panel {
    position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; top: auto;
    max-height: 84vh; border-radius: 18px 18px 0 0; border-bottom: 0;
    padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
    transform: translateY(105%); transition: transform .25s ease;
    box-shadow: 0 -16px 40px rgba(10, 20, 30, .22);
  }
  .panel.open { transform: none; }
  .close-btn { display: inline-block; }
  .scrim.open { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(8, 14, 20, .38); }
  .search { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span class="kicker">Course notes · offer, cold calling, sales</span>
    <h1>Sales Playbook Map</h1>
    <p class="sub">Each module is a line of stops in call order. Tap a stop or a branch to open its rules, scripts and examples. Star the lines you'll actually use and add your own notes to build your process.</p>
  </header>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Modules" id="tabs"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Search scripts, frameworks, rules…" autocomplete="off" aria-label="Search the playbook">
      <div class="results" id="results" hidden></div>
    </div>
  </div>

  <main class="layout" id="mapView">
    <div class="map" id="map"></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <section class="playbook" id="playbookView" hidden></section>
</div>
<div class="scrim" id="scrim"></div>

<script>
const MODULES = [
{
  id: "offer", name: "Offer", letter: "O",
  flow: "Build order · 8 stops",
  lead: "What you promise, who you promise it to, and how you keep clients once they buy.",
  stations: [
    { id: "o-offer", title: "Service vs offer", short: "Sell the change, not the task",
      summary: "The service is what you do. The offer is the promise of what changes for the client.",
      points: ["Ask: what actually changes for a company when it uses my service?", "That change is the offer."],
      branches: [
        { id: "o-beat", title: "Beat the market", summary: "A repeatable way to make the offer better than anyone else's.", ordered: true,
          points: ["Write down every activity you do in the business.", "Pick one and make it better than anyone else in the market.", "Repeat."] }
      ] },
    { id: "o-market", title: "Market", short: "Niche down",
      summary: "Niche down so you can personalise better. Better personalisation means fewer existing beliefs to break and get past.",
      branches: [
        { id: "o-aware", title: "Awareness stages", summary: "Move the prospect through three stages of awareness.", ordered: true,
          points: ["Problem aware", "Solution aware", "Aware of your method"] }
      ] },
    { id: "o-msg", title: "Messaging", short: "Their words, no risk",
      summary: "Speak to prospects directly, even when they're thousands of kilometres away.",
      points: ["Use the ICP's language. Every industry has its own words and lingo; put them in the offer so it reads as if written for them.", "Remove the risk in the offer (see Guarantee)."] },
    { id: "o-six", title: "Six elements", short: "Size up the problem",
      summary: "Six elements of a problem, and of the offer that solves it.", ordered: true,
      points: ["Size: how big is the problem?", "Duration: how long have they been in pain? Longer pain lets you charge more.", "Complexity: how hard is it to solve? Can they just Google it?", "Skill", "Certainty", "Speed"] },
    { id: "o-guar", title: "Guarantee", short: "Remove the fear",
      summary: "A guarantee removes the fear, not all of the risk.",
      branches: [
        { id: "o-parts", title: "Four parts of an offer", summary: "Every offer carries these four parts.",
          points: ["Promise: what changes (the outcome).", "Guarantee: who carries the risk.", "CTA: what you want them to do next.", "Urgency and scarcity: why now."] },
        { id: "o-check", title: "Before you guarantee", summary: "Run four checks before you commit to a guarantee.",
          points: ["Control: is the outcome inside your control? If it depends on things you can't control, you'll end up breaking it.", "Track record: have you delivered enough to know your real win rate? A guarantee based on your best case is a bet.", "Cost: can you afford to pay it out in your worst realistic month?", "Stage fit: does it match the stage your business is in?"] },
        { id: "o-types", title: "Four types", summary: "Pick the guarantee that fits the business and the buyer.",
          table: { head: ["Type", "How it works"], rows: [
            ["Unconditional", "Pay, try it, full refund if not happy, no questions asked. Usually for product businesses."],
            ["Conditional", "If you do what our best clients do and don't get results, we refund or keep working for free."],
            ["Anti-guarantee", "All sales are final. For buyers who don't need a safety net to commit."],
            ["Performance", "We only get paid when we get the results."] ] } },
        { id: "o-specific", title: "Be specific", summary: "State the guarantee in exact, measurable terms.",
          scripts: ["If your cost per lead doesn't drop within 90 days, we don't invoice you for month four."] }
      ] },
    { id: "o-ladder", title: "Value ladder", short: "Price up, trust up",
      summary: "Offer several services at rising price points. Every step up, including any new product, must meet three conditions.",
      ordered: true, points: ["Trust goes up.", "Value goes up.", "Commitment goes up."],
      branches: [
        { id: "o-place", title: "Placing a product", summary: "Questions that decide where a product sits on the ladder.",
          points: ["How much trust is required?", "How big a problem does it solve?", "How much commitment is required?", "How much personalisation is required?", "What is the customer's next problem after this?"] }
      ] },
    { id: "o-onboard", title: "Onboarding", short: "Five steps after the yes",
      summary: "Set expectations from day one.", ordered: true,
      points: ["Clarify the promise: the result we deliver.", "Map the customer journey: what to expect, the next steps, what happens after each stage.", "Identify the decision maker, and who else we need to keep happy.", "Sign the contract.", "Send team and FAQ docs."] },
    { id: "o-success", title: "Client success", short: "Performance, experience, support",
      summary: "Retention beats acquisition. Client success has three parts.",
      points: ["Performance: help them win by delivering the result promised.", "Experience: make them happy.", "Support: make it easy to work with you. Example: send a transcript after every call."],
      table: { head: ["", "Performance", "Experience", "Support"], rows: [
        ["Question", "Did they get the result promised at the sale?", "How happy are they with the service and the journey?", "How easy is it for them to work with us?"],
        ["Measure", "Result delivered", "NPS rating, 1–10", "No technical tickets: questions answered upfront"],
        ["How", "Milestone reviews, progress reports", "30-day check-ins, pulse surveys", "Ease of access, onboarding docs, how-to guides"] ] },
      branches: [
        { id: "o-stats", title: "Why retention", summary: "The numbers behind client success.",
          points: ["Acquiring a client costs 5–25× more than retaining one.", "A 5% improvement in retention yields 25–95% more profit.", "Chance of a sale: 60–70% with existing clients vs 5–20% with new prospects.", "65% of a company's revenue comes from retention.", "$75 billion is lost per year to churn and poor service.", "72% of clients switch after one bad experience.", "80% of businesses say their service is good; only 8% of their clients agree."] }
      ] }
  ]
},
{
  id: "cold-calling", name: "Cold calling", letter: "C",
  flow: "Call flow · 8 stages",
  lead: "Ask questions, don't make statements: 6–8 questions to a meeting, callback, proposal or referral.",
  before: { label: "Before you dial", nodes: [
    { id: "c-prep", title: "Pre-call checklist", short: "Five checks before every session", ordered: true,
      points: ["Tracking set up (software options are in the course PDF).", "Hard rule: don't over-research a prospect or get overexcited about one.", "Know what you'll say before dialing.", "Know your outcomes, in priority order.", "Breath work to calm your nerves."],
      branches: [
        { id: "c-outcomes", title: "Outcomes by priority", summary: "Every call ends in one of these, best first.", ordered: true,
          points: ["Meeting booked", "Callback requested", "Referral to someone they know who needs this", "Permission to keep in touch"] }
      ] },
    { id: "c-practice", title: "Practice: 10 straight no's", short: "Daily reps",
      summary: "Get 10 straight no's. Repeat it for a few days.",
      points: ["Track everything. Go by numbers, not emotion."] },
    { id: "c-icp", title: "ICP and SAM model", short: "Who you call",
      summary: "Define the ICP at two levels: the company and the individual.",
      table: { head: ["Level", "Define"], rows: [["Company", "Size, location, industry, revenue"], ["Individual", "Position or title in the company"]] },
      warn: ["Different company sizes have different pain points, so the offer should depend on company size.", "The decision maker differs by company size and by service."],
      branches: [
        { id: "c-sam", title: "SAM model example", summary: "A weak example from the course: the parameters must make sense together.",
          points: ["Age: 27–60", "Occupation: business owners and CEOs", "Income: 20–30k per month", "Education: master's", "Location: UAE", "Company revenue and size: a defined range"] }
      ] }
  ] },
  stations: [
    { id: "c-open", title: "Open", short: "How's your day going?",
      summary: "Greet them like an old friend. The purpose is the greeting.",
      scripts: ["John, good morning. How's your day going?"],
      warn: ["Don't say their full name.", "Don't ask if it's them. Assume it is and start talking."] },
    { id: "c-time", title: "Time check", short: "Is this a good time?",

/* ---------- index ---------- */
const NODES = {}, ORDER = {};
MODULES.forEach(m => {
  ORDER[m.id] = [];
  const add = (n, parent, kind, num) => {
    NODES[n.id] = { n, m, parent, kind, num };
    ORDER[m.id].push(n.id);
    (n.branches || []).forEach(b => add(b, n, "branch"));
  };
  ((m.before && m.before.nodes) || []).forEach(n => add(n, null, "before"));
  m.stations.forEach((n, i) => add(n, null, "station", i + 1));
  ((m.after && m.after.nodes) || []).forEach(n => add(n, null, "after"));
});
const nodeText = n => [n.title, n.short, n.summary, ...(n.points || []), ...(n.scripts || []), ...(n.warn || []),
  ...((n.list2 && n.list2.items) || []), ...((n.table && n.table.rows.flat()) || [])].filter(Boolean).join(" ");

/* ---------- storage (per browser) ---------- */
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const $ = id => document.getElementById(id);
const isNarrow = () => window.matchMedia("(max-width: 899px)").matches;
const modVar = id => `var(--${id})`;
const hasStars = id => stars.some(s => s.startsWith(id + "#"));
async function copyText(text, btn) {
  const done = () => { const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = t; }, 1200); };
  try { await navigator.clipboard.writeText(text); done(); }
  catch (e) {
    const ta = h("textarea", { style: "position:fixed;opacity:0;left:-9999px" }); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e2) { btn.textContent = "Select and copy"; }
    ta.remove();
  }
}

      h("span", { class: "badge", text: m.letter }), m.name, h("span", { class: "count", text: String(m.stations.length) })));
  });
  tabs.append(h("button", { class: "tab", role: "tab", "data-mod": "playbook", "aria-selected": String(state.view === "playbook"), onclick: () => go("playbook") },

function chips(n) {

  return h("div", { class: "branches" }, n.branches.map(b =>
    h("button", { class: "chip", "data-id": b.id, onclick: () => select(b.id, true) }, b.title, hasStars(b.id) ? h("span", { class: "star-dot", text: "★" }) : null)));

    n.short ? h("span", { class: "node-short", text: n.short }) : null);
}
function group(g) {
  if (!g) return null;
  return h("section", { class: "group" }, h("div", { class: "group-label", text: g.label }),
    g.nodes.map(n => h("div", { class: "gnode" }, nodeButton(n), chips(n))));
}
function renderMap(m) {
  const map = $("map"); map.textContent = "";

      h("div", {}, nodeButton(n), chips(n))))));
  map.append(group(m.after) || "");
}

  document.querySelectorAll("#map [data-id]").forEach(e => e.classList.toggle("is-active", e.dataset.id === sel));
  const stationId = info ? (info.parent ? info.parent.id : info.n.id) : null;
  document.querySelectorAll("#map .station").forEach(e => e.classList.toggle("is-active", e.dataset.station === stationId));
}

/* ---------- detail ---------- */
function list(items, ordered) { return h(ordered ? "ol" : "ul", {}, items.map(t => h("li", { text: t }))); }
function table(t) {
  return h("div", { class: "table-wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, t.head.map(c => h("th", { text: c })))),
    h("tbody", {}, t.rows.map(r => h("tr", {}, r.map(c => h("td", { text: c })))))));
}
function scriptCard(nodeId, text, i) {
  const key = nodeId + "#" + i;
  const on = stars.includes(key);
  const starBtn = h("button", { class: "mini", "aria-pressed": String(on), onclick: () => toggleStar(key, starBtn) }, on ? "★ Starred" : "☆ Star");
  const copyBtn = h("button", { class: "mini", onclick: () => copyText(text, copyBtn) }, "Copy");
  return h("div", { class: "script" }, h("q", { text: text }), h("div", { class: "script-actions" }, copyBtn, starBtn));
}
function toggleStar(key, btn) {
  const i = stars.indexOf(key);
  if (i >= 0) stars.splice(i, 1); else stars.push(key);
  save("pbmap-stars", stars);
  const on = stars.includes(key);
  btn.setAttribute("aria-pressed", String(on)); btn.textContent = on ? "★ Starred" : "☆ Star";
  renderTabs(); renderMap(MODULES.find(m => m.id === state.view)); markActive();
}
function renderDetail() {
  const panel = $("panel"); panel.textContent = "";
  const id = state.selected[state.view];
  const info = NODES[id]; if (!info) return;
  const { n, m, parent, kind, num } = info;
  const where = kind === "station" ? `Stage ${num} of ${m.stations.length}` :
    kind === "branch" ? `Branch of ${parent.title}` :
    (kind === "before" ? m.before.label : m.after.label);
  panel.append(h("div", { class: "panel-top" },
    h("span", { class: "eyebrow", text: `${m.name} · ${where}` }),
    h("button", { class: "close-btn", onclick: closeSheet }, "Close")));
  panel.append(h("h2", { text: n.title }));
  if (n.summary) panel.append(h("p", { class: "summary", text: n.summary }));
  if (n.points) panel.append(h("div", { class: "sec" }, h("h3", { text: n.pointsLabel || "Key points" }), list(n.points, n.ordered)));
  if (n.table) panel.append(h("div", { class: "sec" }, h("h3", { text: "At a glance" }), table(n.table)));
  if (n.list2) panel.append(h("div", { class: "sec" }, h("h3", { text: n.list2.label }), list(n.list2.items)));
  if (n.scripts) panel.append(h("div", { class: "sec" }, h("h3", { text: n.scripts.length > 1 ? "Say it" : "Say it" }), n.scripts.map((s, i) => scriptCard(n.id, s, i))));
  if (n.warn) panel.append(h("div", { class: "sec callout" }, h("h3", { text: "Watch out" }), list(n.warn)));
  if (n.branches) panel.append(h("div", { class: "sec" }, h("h3", { text: "Branches" }),
    h("div", { class: "branch-list" }, n.branches.map(b => h("button", { class: "chip", onclick: () => select(b.id, true) }, b.title)))));
  if (parent) panel.append(h("div", { class: "sec" }, h("h3", { text: "Back to" }),
    h("div", { class: "branch-list" }, h("button", { class: "chip", onclick: () => select(parent.id, true) }, "↑ " + parent.title))));
  const ta = h("textarea", { id: "note-" + n.id, placeholder: "How you'll run this step: your words, your tweaks, what worked on real calls." });
  ta.value = notes[n.id] || "";
  ta.addEventListener("input", () => {
    if (ta.value.trim()) notes[n.id] = ta.value; else delete notes[n.id];
    save("pbmap-notes", notes);
  });
  panel.append(h("div", { class: "sec notes" }, h("h3", { text: "My notes" }), ta, h("span", { class: "hint", text: "Saved in this browser. Starred lines and notes collect in My playbook." })));
  const order = ORDER[m.id], idx = order.indexOf(id);
  const prev = order[idx - 1], next = order[idx + 1];
  const pbtn = (target, label) => h("button", { disabled: !target, onclick: () => target && select(target, true) },
    h("span", { class: "p-label", text: label }), target ? NODES[target].n.title : "");
  panel.append(h("div", { class: "pager" }, pbtn(prev, "← Previous"), pbtn(next, "Next →")));
  panel.scrollTop = 0;
}

/* ---------- sheet (phones) ---------- */
function openSheet() { if (!isNarrow()) return; $("panel").classList.add("open"); $("scrim").classList.add("open"); }
function closeSheet() { $("panel").classList.remove("open"); $("scrim").classList.remove("open"); }
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); $("results").hidden = true; } });

/* ---------- playbook ---------- */
function renderPlaybook() {
  const v = $("playbookView"); v.textContent = "";
  const lines = [];
  const mods = MODULES.map(m => {
    const items = ORDER[m.id].map(id => {
      const { n } = NODES[id];
      const st = (n.scripts || []).map((s, i) => ({ s, key: id + "#" + i })).filter(x => stars.includes(x.key));
      const note = notes[id];
      if (!st.length && !note) return null;
      lines.push(`${m.name} · ${n.title}`);
      st.forEach(x => lines.push(`  - ${x.s}`));
      if (note) lines.push(`  Notes: ${note}`);
      return h("div", { class: "pb-item" },
        h("div", { class: "pb-item-head" }, h("strong", { text: n.title }),
          h("button", { class: "mini", onclick: () => { go(m.id); select(id, true); } }, "Open stop")),
        st.map(x => scriptCard(id, x.s, Number(x.key.split("#")[1]))),
        note ? h("div", { class: "pb-note", text: note }) : null);
    }).filter(Boolean);
    if (!items.length) return null;
    lines.push("");
    return h("section", { class: "pb-mod", "data-mod": m.id }, h("h3", { text: m.name }), items);
  }).filter(Boolean);
  const copyAll = h("button", { class: "btn", onclick: () => copyText(lines.join("\n"), copyAll) }, "Copy all");
  v.append(h("div", { class: "pb-head" },
    h("div", {}, h("h2", { text: "My playbook" }), h("p", { text: "Your starred lines and notes, in call order." })),
    mods.length ? copyAll : null));
  if (!mods.length) {
    v.append(h("div", { class: "empty" }, h("strong", { text: "Nothing here yet. " }),
      "Open any stop, star the scripts you'll use and write notes on how you'll run it. They collect here in call order, ready to copy into your own process."));
  } else v.append(...mods);
}

/* ---------- navigation ---------- */
function render() {
  renderTabs();
  const pb = state.view === "playbook";
  $("mapView").hidden = pb; $("playbookView").hidden = !pb;
  if (pb) { document.documentElement.style.setProperty("--c", "var(--ink)"); renderPlaybook(); closeSheet(); return; }
  const m = MODULES.find(x => x.id === state.view);
  document.documentElement.style.setProperty("--c", modVar(m.id));
  renderMap(m); renderDetail(); markActive();
}
function go(view) {
  if (location.hash !== "#" + view) { location.hash = view; } else { state.view = view; render(); }
}
function select(id, open) {
  const info = NODES[id]; if (!info) return;
  if (state.view !== info.m.id) { state.view = info.m.id; state.selected[info.m.id] = id; if (location.hash !== "#" + info.m.id) location.hash = info.m.id; render(); }
  else { state.selected[info.m.id] = id; renderDetail(); markActive(); }
  if (open) openSheet();
}
function fromHash() {
  const v = location.hash.slice(1);
  const valid = v === "playbook" || MODULES.some(m => m.id === v);
  state.view = valid ? v : "offer";
  render();
}
window.addEventListener("hashchange", fromHash);

/* ---------- search ---------- */
const INDEX = Object.values(NODES).map(x => ({ id: x.n.id, text: nodeText(x.n), lower: nodeText(x.n).toLowerCase(), x }));
$("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  const box = $("results"); box.textContent = "";
  if (q.length < 2) { box.hidden = true; return; }
  const hits = INDEX.filter(r => r.lower.includes(q)).slice(0, 14);
  if (!hits.length) box.append(h("div", { class: "no-results", text: "No matches. Try a word from a script, like “budget” or “Monday”." }));
  hits.forEach(r => {
    const i = r.lower.indexOf(q), s = Math.max(0, i - 40);
    const snip = (s > 0 ? "…" : "") + r.text.slice(s, i + q.length + 60) + "…";
    const meta = r.x.m.name + (r.x.parent ? " · " + r.x.parent.title : "");
    box.append(h("button", { class: "result", style: `--rc: ${modVar(r.x.m.id)}`, onclick: () => { box.hidden = true; e.target.value = ""; select(r.id, true); } },
      h("span", { class: "r-title", text: r.x.n.title }), h("span", { class: "r-meta", text: meta }), h("span", { class: "r-snip", text: snip })));
  });
  box.hidden = false;
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("results").hidden = true; });

fromHash();
</script>

</body>
</html>
